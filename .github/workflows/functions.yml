name: Funções Supabase

# As funções de produção só saem pelo GitHub após merge. A chave do Resend fica
# apenas nos Secrets do repositório e é copiada para o cofre da função neste passo.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: funcoes-supabase-producao
  cancel-in-progress: false

jobs:
  publicar-relatorio-vencimentos:
    name: Publicar relatório diário de vencimentos
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PROJECT_REF: gohluceldchoitihrimw
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Confirmar a chave de envio
        run: |
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "Falta configurar o Secret RESEND_API_KEY neste repositório."
            exit 1
          fi

      - name: Guardar a chave no cofre da função
        run: supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$PROJECT_REF"

      - name: Publicar função de relatório
        run: supabase functions deploy daily-payable-due-report --project-ref "$PROJECT_REF" --no-verify-jwt
