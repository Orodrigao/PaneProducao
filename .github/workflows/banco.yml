name: Banco (migrations)

# Aplica em produção as migrations que entraram na main via PR.
# Este workflow é o ÚNICO caminho de mudança de schema em produção.
# Nunca aplicar migration manualmente (CLI local, MCP ou SQL Editor).

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/banco.yml"
      - "scripts/supabase-api-config.mjs"
      - "scripts/supabase-api-config.test.mjs"

concurrency:
  group: banco-producao
  cancel-in-progress: false

jobs:
  aplicar-migrations:
    name: Aplicar migrations em produção
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: gohluceldchoitihrimw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Conectar ao projeto
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Mostrar o que será aplicado
        run: supabase db push --dry-run --include-all

      - name: Aplicar migrations
        run: supabase db push --include-all

      # Atualiza somente a lista de schemas expostos. `supabase config push`
      # não é usado aqui porque o config.toml também contém valores locais de
      # Auth; enviar o arquivo inteiro poderia sobrescrever a configuração real.
      - name: Aplicar configuração da Data API
        run: node scripts/supabase-api-config.mjs
