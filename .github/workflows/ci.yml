name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificacao:
    name: Verificação (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar ambiente local seguro
        run: cp .env.example .env.local

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc e build nunca em paralelo: disputam .next/types (ver lessons.md)
      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  # Mora aqui, e nao em banco-preview.yml, de proposito: aquele workflow tem
  # `concurrency: banco-preview-compartilhado`, que vale para o RUN inteiro.
  # Um guarda que nem toca no banco ficaria ocupando a vaga da fila so para
  # descobrir que devia recusar. Aqui ele nao disputa nada.
  #
  # Serializa migration contra migration, sem depender de etiqueta: esquecer o
  # adesivo nao pode custar a ordem de aplicacao na main.
  guarda-migrations:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Uma migration por vez
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recusar duas PRs com migration abertas ao mesmo tempo
        env:
          CURRENT_PR: ${{ github.event.pull_request.number }}
          # Uma consulta so: `gh pr view` por PR gastaria N+1 chamadas e bate no
          # limite de requisicoes num dia movimentado.
          LIMITE_PRS: 200
        run: |
          PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit "$LIMITE_PRS" --json number,files)"

          # Lista truncada = trava que nao enxerga tudo. Uma trava de
          # serializacao tem de falhar FECHADA: deixar passar uma migration que
          # existe e pior que barrar uma que nao existe.
          if [[ "$(jq 'length' <<<"$PRS")" -ge "$LIMITE_PRS" ]]; then
            echo "Ha $LIMITE_PRS ou mais PRs abertas e a lista veio cortada."
            echo "Nao da para garantir a serializacao, entao estou barrando por seguranca."
            echo "O que fazer: aumente LIMITE_PRS neste workflow."
            exit 1
          fi

          if [[ "$(jq --argjson atual "$CURRENT_PR" '[.[] | select(.number == $atual)] | length' <<<"$PRS")" -eq 0 ]]; then
            echo "Esta PR (#$CURRENT_PR) nao apareceu na lista de PRs abertas."
            echo "Sem conseguir ler o proprio estado, barro por seguranca."
            exit 1
          fi

          com_migration() {
            jq -r --argjson atual "$CURRENT_PR" "$1" <<<"$PRS"
          }

          if [[ "$(com_migration '[.[] | select(.number == $atual) | .files[]? | select(.path | startswith("supabase/migrations/"))] | length')" -eq 0 ]]; then
            echo "Esta PR nao tem migration: nada a serializar, siga em frente."
            exit 0
          fi

          OUTRAS="$(com_migration '[.[] | select(.number != $atual) | select([.files[]? | select(.path | startswith("supabase/migrations/"))] | length > 0) | "#\(.number)"] | join(", ")')"

          if [[ -n "$OUTRAS" ]]; then
            echo "Outra PR com migration esta aberta: $OUTRAS"
            echo "Duas migrations abertas ao mesmo tempo colidem na ordem de aplicacao:"
            echo "o supabase db push aplica por timestamp e nao negocia."
            echo "O que fazer: feche ou integre a outra PR antes desta, ou espere o aviso"
            echo "de quem estiver com ela. Depois reexecute este job."
            exit 1
          fi

          echo "Esta PR tem migration e e a unica aberta. Pode seguir."

  navegador:
    name: Navegador (login, perfis e lojas)
    needs: verificacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_SUPABASE_URL: https://tuqzhjsbodoycjbmwuqm.supabase.co
      SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar ambiente fictício e credencial de teste
        run: |
          if ! grep -q "$PREVIEW_SUPABASE_URL" .env.example; then
            echo "Teste de navegador bloqueado: .env.example nao aponta ao PaneERP Preview."
            exit 1
          fi
          if [[ -z "$SUPABASE_TEST_USER_PASSWORD" ]]; then
            echo "Teste de navegador bloqueado: SUPABASE_TEST_USER_PASSWORD nao esta configurado."
            exit 1
          fi

      - name: Confirmar que o Preview está disponível
        run: |
          set -a
          source .env.example
          set +a
          if ! curl --fail --silent --show-error --retry 2 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$PREVIEW_SUPABASE_URL/auth/v1/health" >/dev/null; then
            echo "PaneERP Preview esta indisponivel ou pausado. Reative o projeto antes de investigar o ERP."
            exit 1
          fi

      - name: Esperar Banco Preview quando necessario
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Espelha a condicao do job "Reconstruir Preview desta PR" em
          # banco-preview.yml. Sem a etiqueta aquele job nem roda, e esperar por
          # um check que nunca reporta estouraria o tempo em toda PR.
          PR_TEM_ETIQUETA: ${{ contains(github.event.pull_request.labels.*.name, 'precisa-banco-preview') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_TEM_ETIQUETA" != "true" ]]; then
            echo "PR sem a etiqueta precisa-banco-preview: o banco de teste nao e reconstruido para ela."
            echo "A migration desta PR, se houver, e provada pelo ensaio descartavel do CI Banco."
            echo ""
            # NAO afirme "restaurado a partir da main": so e verdade logo apos um
            # merge. Entre merges o Preview esta no estado da ultima PR
            # etiquetada, e mentir aqui manda o proximo investigar o proprio diff.
            echo "Contra o que este smoke vai rodar, de fato:"
            ULTIMA="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=banco-preview.yml \
              --limit 20 --json headBranch,conclusion,createdAt,event \
              --jq '[.[] | select(.conclusion == "success")][0] | "  ultima reconstrucao: \(.createdAt) pela branch \(.headBranch) (\(.event))"' 2>/dev/null || true)"
            if [[ -n "$ULTIMA" ]]; then
              echo "$ULTIMA"
              echo "  Se a branch acima nao for main nem esta PR, o Preview esta com o"
              echo "  schema e os dados de outra branch. Falha por dado aqui NAO e defeito"
              echo "  do seu diff: etiquete esta PR para ter o cenario dela, ou espere a"
              echo "  outra fechar."
            else
              echo "  nao consegui descobrir; veja o workflow Banco Preview."
            fi
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Push na main; aguardando Banco Preview reconstruir os dados ficticios de hoje."
            for attempt in {1..60}; do
              CHECK_STATE="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "Restaurar Banco Preview para a main") | [.status, (.conclusion // "")] | @tsv' | tail -n 1)"
              CHECK_STATUS="$(cut -f1 <<<"$CHECK_STATE")"
              CHECK_CONCLUSION="$(cut -f2 <<<"$CHECK_STATE")"

              if [[ "$CHECK_STATUS" == "completed" && "$CHECK_CONCLUSION" == "success" ]]; then
                echo "Banco Preview pronto."
                exit 0
              fi
              if [[ "$CHECK_STATUS" == "completed" ]]; then
                echo "Banco Preview terminou com estado: ${CHECK_CONCLUSION:-desconhecido}"
                exit 1
              fi

              echo "Banco Preview ainda em andamento (${CHECK_STATUS:-sem check}); tentativa $attempt/60."
              sleep 10
            done

            echo "Banco Preview nao ficou pronto dentro do tempo esperado."
            exit 1
          fi

          # Quem esta segurando o banco compartilhado agora. Sem isto, descobrir
          # quem atropelou exige listar execucoes e comparar horarios na mao.
          quem_ocupa_o_banco() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow=banco-preview.yml \
              --limit 10 --json databaseId,status,headBranch \
              --jq '[.[] | select(.status == "in_progress" or .status == "queued")]
                    | if length == 0 then "  (nenhuma execucao ativa; o banco esta livre agora)"
                      else .[] | "  run \(.databaseId) da branch \(.headBranch) (\(.status))" end'
          }

          echo "Aguardando o Banco Preview reconstruir os dados ficticios desta PR."
          SEM_CHECK=0
          for attempt in {1..60}; do
            BUCKET="$(gh pr checks "$PR_NUMBER" --json name,bucket --jq '.[] | select(.name == "Reconstruir Preview desta PR") | .bucket' | tail -n 1)"

            if [[ "$BUCKET" == "pass" ]]; then
              echo "Banco Preview pronto."
              exit 0
            fi

            if [[ "$BUCKET" == "fail" || "$BUCKET" == "cancel" ]]; then
              echo "A reconstrucao do Banco Preview desta PR terminou como '$BUCKET'."
              if [[ "$BUCKET" == "cancel" ]]; then
                echo "Cancelada quase sempre significa EXPULSA DA FILA por outra execucao."
              fi
              echo "Quem esta com o banco agora:"
              quem_ocupa_o_banco
              echo "Reexecute o workflow 'Banco Preview' desta PR e so depois este job."
              exit 1
            fi

            # Check ausente por tempo demais: a execucao foi expulsa antes mesmo
            # de comecar, entao nao existe check nenhum para reportar estado.
            # Falhar aqui em 90s, com o motivo escrito, em vez de contar ate 60
            # e morrer por tempo — tempo esgotado ensina a mandar rodar de novo
            # sem investigar (ver lessons.md, smoke do Romaneio EX).
            # Raciocinio, nao medicao: execucao retida por concorrencia publica
            # check em estado "queued", entao BUCKET vem "pending" e o contador
            # zera — a espera de fila NAO cai aqui. Nao consegui provar isso na
            # pratica, so por leitura da documentacao, entao a margem e generosa:
            # 180s. Se algum dia este abandono disparar com a fila cheia e uma
            # reconstrucao legitima a caminho, o numero errado e este.
            if [[ -z "$BUCKET" ]]; then
              SEM_CHECK=$((SEM_CHECK + 1))
              if [[ "$SEM_CHECK" -ge 18 ]]; then
                echo "Passaram 180 segundos e o check 'Reconstruir Preview desta PR' nunca apareceu."
                echo "A reconstrucao desta PR foi expulsa da fila antes de comecar."
                echo "Quem esta com o banco agora:"
                quem_ocupa_o_banco
                echo "Reexecute o workflow 'Banco Preview' desta PR e so depois este job."
                exit 1
              fi
            else
              SEM_CHECK=0
            fi

            echo "Banco Preview ainda em andamento (${BUCKET:-sem check}); tentativa $attempt/60."
            sleep 10
          done

          echo "Banco Preview nao ficou pronto dentro do tempo esperado."
          echo "Quem esta com o banco agora:"
          quem_ocupa_o_banco
          exit 1

      - name: Preparar ambiente local seguro
        run: cp .env.example .env.local

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O cenario da EX vive de um fio: o pedido do dia e de 8 baguetes e as
      # viagens anteriores ja levaram 18, entao o produto so aparece na tela
      # enquanto a reposicao ficticia estiver aberta. Qualquer coisa que consuma
      # essa linha (uso do preview da Vercel, reconstrucao pela metade, seed de
      # ontem) faz o smoke reprovar sem defeito no codigo. Conferir aqui troca um
      # vermelho misterioso por uma instrucao.
      - name: Confirmar que o cenario ficticio do dia esta intacto
        env:
          # Necessario para o diagnostico de corrida na mensagem de falha
          # listar as execucoes recentes do Banco Preview.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a
          source .env.example
          set +a
          HOJE="$(TZ=America/Sao_Paulo date +%F)"
          CORPO="$(jq -n --arg password "$SUPABASE_TEST_USER_PASSWORD" '{email: "rodrigao+teste@gmail.com", password: $password}')"

          entrar() {
            curl --silent --show-error --write-out '\n%{http_code}' \
              --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header 'Content-Type: application/json' \
              --data "$CORPO" \
              "$PREVIEW_SUPABASE_URL/auth/v1/token?grant_type=password"
          }

          # "Banco reconstruido" nao e a mesma coisa que "da para entrar": em
          # banco-preview.yml o db reset vem primeiro e as contas do Auth so
          # nascem dois passos depois (provision-preview-users.mjs), com o seed
          # rodando de novo em seguida para ligar perfis as contas novas.
          # Medido por outra sessao em 2026-08-22: 19 segundos entre o fim da
          # reconstrucao e um login ainda com invalid_credentials, e a main
          # vermelha duas vezes na mesma noite pelo mesmo motivo, passando verde
          # na reexecucao sem mudar uma linha. Tres tentativas com 5s cobriam
          # ~15s, menos que a janela real. Agora sao 12 tentativas com 10s.
          TOKEN=""
          RESPOSTA=""
          for tentativa in $(seq 1 12); do
            RESPOSTA="$(entrar)"
            TOKEN="$(sed '$d' <<<"$RESPOSTA" | jq -r '.access_token // empty' 2>/dev/null || true)"
            if [[ -n "$TOKEN" ]]; then break; fi
            echo "Tentativa $tentativa/12 de entrar no Banco Preview devolveu HTTP $(tail -n1 <<<"$RESPOSTA"); as contas podem ainda estar sendo criadas."
            sleep 10
          done

          if [[ -z "$TOKEN" ]]; then
            echo "Nao foi possivel entrar no Banco Preview com a conta ficticia de administrador."
            echo "Esperei 2 minutos: nao e demora na criacao das contas, e outra coisa."
            echo ""
            echo "O que fazer, nesta ordem:"
            echo "  1. Confira se o projeto PaneERP Preview esta ACTIVE_HEALTHY no Supabase;"
            echo "     projeto pausado devolve exatamente este erro."
            echo "  2. Veja se outra PR reconstruiu o banco no meio deste job:"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow=banco-preview.yml \
              --limit 5 --json databaseId,status,conclusion,headBranch,createdAt \
              --jq '.[] | "     \(.createdAt)  \(.headBranch)  \(.status)/\(.conclusion // "-")  run \(.databaseId)"' || true
            echo "  3. Se alguma acima cruzou com o horario deste job, e corrida de"
            echo "     infraestrutura: rode de novo o 'Banco Preview' DESTA branch e"
            echo "     so depois este job."
            echo "  4. Se nada cruzou e o projeto esta no ar, ai sim e defeito de verdade:"
            echo "     o seed ou o provision-preview-users.mjs falhou. Leia o log da"
            echo "     ultima reconstrucao antes de mexer no diff."
            echo ""
            echo "Resposta do Auth: $(sed '$d' <<<"$RESPOSTA")"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          consultar() {
            curl --fail --silent --show-error \
              --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $TOKEN" \
              "$PREVIEW_SUPABASE_URL/rest/v1/$1"
          }

          VIAGEM="$(consultar "romaneios?id=eq.40000000-0000-4000-8000-000000000002&record_date=eq.$HOJE&select=id")"
          REPOSICAO="$(consultar "romaneio_replacement_pending?id=eq.42000000-0000-4000-8000-000000000002&status=eq.aberta&pending_quantity=eq.2&select=id")"

          if [[ "$(jq 'length' <<<"$VIAGEM")" -ne 1 || "$(jq 'length' <<<"$REPOSICAO")" -ne 1 ]]; then
            echo "O cenario de reposicao da EX nao esta no estado esperado para $HOJE."
            echo "Viagem de origem com a data de hoje: $VIAGEM"
            echo "Reposicao aberta de 2 un: $REPOSICAO"
            echo "Isto NAO e defeito do diff: os dados ficticios foram consumidos ou sao de outro dia."
            echo "Rode de novo o workflow 'Banco Preview' desta PR e so depois este job."
            exit 1
          fi
          echo "Cenario de reposicao da EX intacto para $HOJE."

      - name: Smoke tests no navegador
        run: npm run test:browser
