name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificacao:
    name: Verificação (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar ambiente local seguro
        run: cp .env.example .env.local

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc e build nunca em paralelo: disputam .next/types (ver lessons.md)
      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  navegador:
    name: Navegador (login, perfis e lojas)
    needs: verificacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesmo grupo do workflow Banco Preview: o smoke le o banco compartilhado e
    # a reconstrucao o APAGA (db reset derruba schema, dados e contas do Auth).
    # Sem isto, um smoke que caia dentro da janela de reset falha com
    # "invalid_credentials" sem ter defeito nenhum — foi medido na PR 259, com
    # o reset de outra PR entre 22:03:45 e 22:04:24 e as tres tentativas de
    # login as 22:04:03, 22:04:08 e 22:04:14. Espera em fila, nunca cancela.
    concurrency:
      group: banco-preview-compartilhado
      cancel-in-progress: false
    env:
      PREVIEW_SUPABASE_URL: https://tuqzhjsbodoycjbmwuqm.supabase.co
      SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar ambiente fictício e credencial de teste
        run: |
          if ! grep -q "$PREVIEW_SUPABASE_URL" .env.example; then
            echo "Teste de navegador bloqueado: .env.example nao aponta ao PaneERP Preview."
            exit 1
          fi
          if [[ -z "$SUPABASE_TEST_USER_PASSWORD" ]]; then
            echo "Teste de navegador bloqueado: SUPABASE_TEST_USER_PASSWORD nao esta configurado."
            exit 1
          fi

      - name: Confirmar que o Preview está disponível
        run: |
          set -a
          source .env.example
          set +a
          if ! curl --fail --silent --show-error --retry 2 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "$PREVIEW_SUPABASE_URL/auth/v1/health" >/dev/null; then
            echo "PaneERP Preview esta indisponivel ou pausado. Reative o projeto antes de investigar o ERP."
            exit 1
          fi

      - name: Esperar Banco Preview quando necessario
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Espelha a condicao do job "Reconstruir Preview desta PR" em
          # banco-preview.yml. Sem a etiqueta aquele job nem roda, e esperar por
          # um check que nunca reporta estouraria o tempo em toda PR.
          PR_TEM_ETIQUETA: ${{ contains(github.event.pull_request.labels.*.name, 'precisa-banco-preview') }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_TEM_ETIQUETA" != "true" ]]; then
            echo "PR sem a etiqueta precisa-banco-preview: o banco de teste nao e reconstruido para ela."
            echo "O smoke roda contra o Banco Preview como esta, restaurado a partir da main."
            echo "A migration desta PR, se houver, e provada pelo ensaio descartavel do CI Banco."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Push na main; aguardando Banco Preview reconstruir os dados ficticios de hoje."
            for attempt in {1..60}; do
              CHECK_STATE="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | select(.name == "Restaurar Banco Preview para a main") | [.status, (.conclusion // "")] | @tsv' | tail -n 1)"
              CHECK_STATUS="$(cut -f1 <<<"$CHECK_STATE")"
              CHECK_CONCLUSION="$(cut -f2 <<<"$CHECK_STATE")"

              if [[ "$CHECK_STATUS" == "completed" && "$CHECK_CONCLUSION" == "success" ]]; then
                echo "Banco Preview pronto."
                exit 0
              fi
              if [[ "$CHECK_STATUS" == "completed" ]]; then
                echo "Banco Preview terminou com estado: ${CHECK_CONCLUSION:-desconhecido}"
                exit 1
              fi

              echo "Banco Preview ainda em andamento (${CHECK_STATUS:-sem check}); tentativa $attempt/60."
              sleep 10
            done

            echo "Banco Preview nao ficou pronto dentro do tempo esperado."
            exit 1
          fi

          echo "Aguardando o Banco Preview reconstruir os dados ficticios desta PR."
          for attempt in {1..60}; do
            BUCKET="$(gh pr checks "$PR_NUMBER" --json name,bucket --jq '.[] | select(.name == "Reconstruir Preview desta PR") | .bucket' | tail -n 1)"
            if [[ "$BUCKET" == "pass" ]]; then
              echo "Banco Preview pronto."
              exit 0
            fi
            if [[ "$BUCKET" == "fail" || "$BUCKET" == "cancel" ]]; then
              echo "Banco Preview terminou com estado: $BUCKET"
              exit 1
            fi
            echo "Banco Preview ainda em andamento (${BUCKET:-sem check}); tentativa $attempt/60."
            sleep 10
          done

          echo "Banco Preview nao ficou pronto dentro do tempo esperado."
          exit 1

      - name: Preparar ambiente local seguro
        run: cp .env.example .env.local

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O cenario da EX vive de um fio: o pedido do dia e de 8 baguetes e as
      # viagens anteriores ja levaram 18, entao o produto so aparece na tela
      # enquanto a reposicao ficticia estiver aberta. Qualquer coisa que consuma
      # essa linha (uso do preview da Vercel, reconstrucao pela metade, seed de
      # ontem) faz o smoke reprovar sem defeito no codigo. Conferir aqui troca um
      # vermelho misterioso por uma instrucao.
      - name: Confirmar que o cenario ficticio do dia esta intacto
        run: |
          set -a
          source .env.example
          set +a
          HOJE="$(TZ=America/Sao_Paulo date +%F)"
          CORPO="$(jq -n --arg password "$SUPABASE_TEST_USER_PASSWORD" '{email: "rodrigao+teste@gmail.com", password: $password}')"

          entrar() {
            curl --silent --show-error --write-out '\n%{http_code}' \
              --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header 'Content-Type: application/json' \
              --data "$CORPO" \
              "$PREVIEW_SUPABASE_URL/auth/v1/token?grant_type=password"
          }

          TOKEN=""
          RESPOSTA=""
          for tentativa in 1 2 3; do
            RESPOSTA="$(entrar)"
            TOKEN="$(sed '$d' <<<"$RESPOSTA" | jq -r '.access_token // empty' 2>/dev/null || true)"
            if [[ -n "$TOKEN" ]]; then break; fi
            echo "Tentativa $tentativa de entrar no Banco Preview devolveu HTTP $(tail -n1 <<<"$RESPOSTA")."
            sleep 5
          done

          if [[ -z "$TOKEN" ]]; then
            echo "Nao foi possivel entrar no Banco Preview com a conta ficticia de administrador."
            echo "Resposta do Auth: $(sed '$d' <<<"$RESPOSTA")"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          consultar() {
            curl --fail --silent --show-error \
              --header "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $TOKEN" \
              "$PREVIEW_SUPABASE_URL/rest/v1/$1"
          }

          VIAGEM="$(consultar "romaneios?id=eq.40000000-0000-4000-8000-000000000002&record_date=eq.$HOJE&select=id")"
          REPOSICAO="$(consultar "romaneio_replacement_pending?id=eq.42000000-0000-4000-8000-000000000002&status=eq.aberta&pending_quantity=eq.2&select=id")"

          if [[ "$(jq 'length' <<<"$VIAGEM")" -ne 1 || "$(jq 'length' <<<"$REPOSICAO")" -ne 1 ]]; then
            echo "O cenario de reposicao da EX nao esta no estado esperado para $HOJE."
            echo "Viagem de origem com a data de hoje: $VIAGEM"
            echo "Reposicao aberta de 2 un: $REPOSICAO"
            echo "Isto NAO e defeito do diff: os dados ficticios foram consumidos ou sao de outro dia."
            echo "Rode de novo o workflow 'Banco Preview' desta PR e so depois este job."
            exit 1
          fi
          echo "Cenario de reposicao da EX intacto para $HOJE."

      - name: Smoke tests no navegador
        run: npm run test:browser
