name: Banco Preview

# Banco remoto descartavel usado pelos previews da Vercel e pelos worktrees.
# Toda PR que usa o smoke de navegador so pode ser testada depois que este
# workflow ficar verde.
# Fechar ou integrar a PR reconstrui o ambiente a partir da main, removendo
# migrations que nunca chegaram a producao.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite RECONSTRUIR para restaurar o banco Preview a partir da main"
        required: true
        type: string

concurrency:
  group: banco-preview-compartilhado
  cancel-in-progress: false
  # `queue: single` (o padrao) NAO e fila: guarda uma unica vaga de espera e a
  # execucao que chega EXPULSA quem estava esperando, em silencio. Foi medido
  # em 2026-08-22: o push da branch chore/banco-preview-sob-demanda expulsou a
  # reconstrucao de fix/unidade-dos-insumos-de-receita, ninguem reconstruiu, e
  # o smoke daquela PR ficou 10 minutos esperando um check que nunca viria.
  # `queue: max` deixa ate 100 execucoes esperarem em ordem. Nao pode ser
  # combinado com cancel-in-progress: true.
  queue: max

permissions:
  contents: read
  pull-requests: read

env:
  PREVIEW_PROJECT_REF: tuqzhjsbodoycjbmwuqm
  PREVIEW_SUPABASE_URL: https://tuqzhjsbodoycjbmwuqm.supabase.co
  PRODUCTION_PROJECT_REF: gohluceldchoitihrimw
  # Etiqueta que pede o banco de teste para esta PR. O nome tambem aparece em
  # ci.yml (passo "Esperar Banco Preview quando necessario") e no AGENTS.md:
  # os tres precisam mudar juntos.
  PREVIEW_LABEL: precisa-banco-preview

jobs:
  # Guarda separado do job de reconstruir, e de proposito: reconstruir agora
  # depende da etiqueta, mas serializar migrations NAO pode depender de alguem
  # lembrar de colar adesivo. Sem este job, duas PRs com migration esquecidas da
  # etiqueta iriam verdes ate a main e so colidiriam la — inclusive na ordem de
  # timestamp, que o `supabase db push` aplica e nao negocia.
  # Note a diferenca para a regra antiga: ela recusava QUALQUER PR quando outra
  # tinha migration (foi o que deixou a PR 225 vermelha sem defeito proprio).
  # Esta recusa so a PR que ELA MESMA tem migration.
  guarda-migrations:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Uma migration por vez
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recusar duas PRs com migration abertas ao mesmo tempo
        env:
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          tem_migration() {
            gh pr view "$1" --repo "$GITHUB_REPOSITORY" --json files \
              --jq '[.files[] | select(.path | startswith("supabase/migrations/"))] | length'
          }

          if [[ "$(tem_migration "$CURRENT_PR")" -eq 0 ]]; then
            echo "Esta PR nao tem migration: nada a serializar, siga em frente."
            exit 0
          fi

          OUTRAS=""
          for numero in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '.[].number'); do
            if [[ "$numero" == "$CURRENT_PR" ]]; then continue; fi
            if [[ "$(tem_migration "$numero")" -gt 0 ]]; then OUTRAS="$OUTRAS $numero"; fi
          done

          if [[ -n "$OUTRAS" ]]; then
            echo "Outra PR com migration esta aberta:$OUTRAS"
            echo "Duas migrations abertas ao mesmo tempo colidem na ordem de aplicacao."
            echo "O que fazer: feche ou integre a outra PR antes desta, ou espere o aviso"
            echo "de quem estiver com ela. Depois reexecute este job."
            exit 1
          fi

          echo "Esta PR tem migration e e a unica aberta. Pode seguir."

  reconstruir-pr:
    # Remendo temporario: enquanto o Banco Preview for um so, compartilhado por
    # todas as PRs, reconstruir a cada PR criava fila e bloqueava PRs que nem
    # tocam no banco. Agora so reconstroi quem pede pela etiqueta. Quando
    # existir banco por pull request, esta condicao e a etiqueta somem juntas.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'precisa-banco-preview')
    name: Reconstruir Preview desta PR
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_OWNER_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Impedir duas PRs etiquetadas no mesmo banco
        env:
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          # A reserva agora vale so entre PRs que pediram o banco pela etiqueta.
          # Antes ela olhava qualquer PR aberta com migration, entao uma PR que
          # nem tocava no banco era bloqueada por migration alheia.
          OTHER_LABELED_PRS="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --label "$PREVIEW_LABEL" --json number | jq --argjson current "$CURRENT_PR" '[.[] | select(.number != $current) | .number]')"
          OTHER_LABELED_COUNT="$(jq 'length' <<<"$OTHER_LABELED_PRS")"

          if [[ "$OTHER_LABELED_COUNT" -gt 0 ]]; then
            echo "O Banco Preview esta reservado por outra PR com a etiqueta $PREVIEW_LABEL: $OTHER_LABELED_PRS"
            echo "Finalize essa PR, ou remova a etiqueta dela, antes de reconstruir o banco para a PR atual."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar que o alvo nunca e producao
        run: |
          if [[ "$PREVIEW_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" || "$PREVIEW_PROJECT_REF" != "tuqzhjsbodoycjbmwuqm" ]]; then
            echo "ALVO BLOQUEADO: o workflow Banco Preview nao recebeu o projeto de teste esperado."
            exit 1
          fi

      - name: Confirmar que o projeto de teste esta acordado
        run: |
          PROJECT_STATUS="$(supabase projects list --output-format json | jq -r --arg ref "$PREVIEW_PROJECT_REF" '(.projects // .)[] | select(.id == $ref) | .status')"
          if [[ "$PROJECT_STATUS" != "ACTIVE_HEALTHY" ]]; then
            echo "Banco de teste indisponivel (estado: ${PROJECT_STATUS:-nao encontrado})."
            echo "Reative PaneERP Preview no Supabase antes de investigar a funcionalidade."
            exit 1
          fi

      - name: Conectar exclusivamente ao Banco Preview
        run: supabase link --project-ref "$PREVIEW_PROJECT_REF"

      - name: Reconstruir schema e dados ficticios desta PR
        run: supabase db reset --linked --yes

      - name: Obter credencial temporaria do Auth de teste
        run: |
          SERVICE_ROLE_KEY="$(supabase projects api-keys --project-ref "$PREVIEW_PROJECT_REF" --output-format json | jq -r '(.keys // .)[] | select(.name == "service_role" and .type == "legacy") | .api_key')"
          if [[ -z "$SERVICE_ROLE_KEY" || "$SERVICE_ROLE_KEY" == "null" ]]; then
            echo "Nao foi possivel obter a chave administrativa do Banco Preview."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_PREVIEW_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Recriar contas ficticias pelo Supabase Auth
        run: node scripts/provision-preview-users.mjs

      - name: Ligar perfis e permissoes as contas ficticias
        run: supabase db query --linked --file supabase/seed.sql

      - name: Confirmar perfis permitidos e bloqueados
        run: supabase db query --linked --file supabase/verification/preview_users.sql

      - name: Verificar invariantes e seed no Banco Preview
        run: supabase test db --linked

  restaurar-main:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false) ||
      github.event_name == 'workflow_dispatch'
    name: Restaurar Banco Preview para a main
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_OWNER_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
    steps:
      - name: Exigir confirmacao da reconstrucao manual
        if: github.event_name == 'workflow_dispatch' && inputs.confirmacao != 'RECONSTRUIR'
        run: |
          echo "Confirmacao invalida. Digite RECONSTRUIR para continuar."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar que o alvo nunca e producao
        run: |
          if [[ "$PREVIEW_PROJECT_REF" == "$PRODUCTION_PROJECT_REF" || "$PREVIEW_PROJECT_REF" != "tuqzhjsbodoycjbmwuqm" ]]; then
            echo "ALVO BLOQUEADO: o workflow Banco Preview nao recebeu o projeto de teste esperado."
            exit 1
          fi

      - name: Confirmar que o projeto de teste esta acordado
        run: |
          PROJECT_STATUS="$(supabase projects list --output-format json | jq -r --arg ref "$PREVIEW_PROJECT_REF" '(.projects // .)[] | select(.id == $ref) | .status')"
          if [[ "$PROJECT_STATUS" != "ACTIVE_HEALTHY" ]]; then
            echo "Banco de teste indisponivel (estado: ${PROJECT_STATUS:-nao encontrado})."
            echo "Reative PaneERP Preview no Supabase antes de investigar a funcionalidade."
            exit 1
          fi

      - name: Conectar exclusivamente ao Banco Preview
        run: supabase link --project-ref "$PREVIEW_PROJECT_REF"

      - name: Apagar desvios e reconstruir a partir da main
        run: supabase db reset --linked --yes

      - name: Obter credencial temporaria do Auth de teste
        run: |
          SERVICE_ROLE_KEY="$(supabase projects api-keys --project-ref "$PREVIEW_PROJECT_REF" --output-format json | jq -r '(.keys // .)[] | select(.name == "service_role" and .type == "legacy") | .api_key')"
          if [[ -z "$SERVICE_ROLE_KEY" || "$SERVICE_ROLE_KEY" == "null" ]]; then
            echo "Nao foi possivel obter a chave administrativa do Banco Preview."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_PREVIEW_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Recriar contas ficticias pelo Supabase Auth
        run: node scripts/provision-preview-users.mjs

      - name: Ligar perfis e permissoes as contas ficticias
        run: supabase db query --linked --file supabase/seed.sql

      - name: Confirmar perfis permitidos e bloqueados
        run: supabase db query --linked --file supabase/verification/preview_users.sql

      - name: Verificar invariantes e seed canonicos
        run: supabase test db --linked
